##
## Texture Cache configuration for Kodi addon
##
## When run as addon, userdata is auto-set to Kodi's profile path.
## Override other defaults below as needed.
##
## See: https://github.com/xbmc/texturecache
##

# xbmc.host = localhost
# webserver.port = 8080
# webserver.username =
# webserver.password =
# rpc.port = 9090
# Seconds of silence allowed while Kodi builds a library chunk. Was 5, which
# aborted "c" during album loading.
rpc.readtimeout = 120
# Failed artwork URLs are written here, then removed from the library.
cache.dropfile = /data/.kodi/userdata/addon_data/script.texture.cache/drop_invalid.json
# download.threads = 2
# download.retry = 5
# download.timeout = 10
